name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=critical
      - run: npm run format
      - run: npm run check
      - name: Verify skills mirror freshness
        run: test -z "$(git status --porcelain -- skills/)" || { echo 'skills/ mirror is stale — run npm run build and commit'; git status --short -- skills/; exit 1; }
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke-all.mjs
      - run: node scripts/smoke-skill-contract.mjs
      - run: node scripts/smoke-design-tokens.mjs
      - run: node scripts/smoke-install.mjs
